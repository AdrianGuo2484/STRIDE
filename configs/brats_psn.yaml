seed: 42
device: auto

data:
  manifest: data/brats2024_segmentation.csv
  patient_column: patient_id
  modality_names: [t1ce, t1, t2, flair]
  modality_columns: [t1ce_path, t1_path, t2_path, flair_path]
  mask_column: abnormal_mask_path
  region_names: [WT, TC, ET]
  region_labels: [[1, 2, 3], [1, 3], [3]]
  whole_tumor_channel: 0
  target_shape: [128, 128, 128]
  target_spacing: [1.25, 1.25, 1.25]
  n_splits: 5
  augment: true
  intensity_scale_range: [0.9, 1.1]
  intensity_shift_range: [-0.1, 0.1]
  intensity_noise_std: 0.03

model:
  num_modalities: 4
  num_regions: 3
  stem_channels: 12
  input_dropout: 0.08
  embed_dim: 96
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  patch_size: 4
  attention_window_size: 8
  localization_scales: [1, 2, 4]
  localization_hidden_channels: 24
  mlp_ratio: 4.0
  dropout: 0.1
  drop_path: 0.15
  use_checkpoint: true

train:
  output_dir: runs/brats2024_psn
  batch_size: 2
  num_workers: 4
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
